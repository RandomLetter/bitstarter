# Cloudflare Workers configuration for Santiago at https://budoludo.com/santiago
name = "santiago"
main = "worker/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Serve everything through the Worker so it can strip the /santiago prefix
# before looking up static assets.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
# Serve .html files as-is; the Worker decides which page maps to which path.
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "santiago"
# Replace with the id printed by: npx wrangler d1 create santiago
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
BASE_PATH = "/santiago"
BASE_URL = "https://budoludo.com/santiago"
MAIL_FROM = "Santiago <santiago@budoludo.com>"

# Route the path prefix on your domain to this Worker.
# Requires the budoludo.com zone to be on your Cloudflare account.
[[routes]]
pattern = "budoludo.com/santiago*"
zone_name = "budoludo.com"

# Secrets (set via CLI, never committed):
#   npx wrangler secret put RESEND_API_KEY
